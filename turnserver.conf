# TURN Server Configuration (coturn)
listening-port=3478
tls-listening-port=5349

# Realm
realm=trioz.ru

# Authentication
#
# FIX-SEC-TURN: пароль отсюда убран. Этот файл лежит в репозитории, поэтому
# всё записанное в нём паролем не является: прежнее значение утекло вместе с
# кодом, и по нему через сервер можно было гонять чужой трафик.
#
# Учётные данные передаются параметром запуска из переменной TURN_CREDENTIAL
# (см. docker-compose.yml: --user=${TURN_USERNAME}:${TURN_CREDENTIAL}).
# То же значение приложение отдаёт клиентам в /api/voice/turn.
lt-cred-mech

# Logging
log-file=stdout
verbose

# Performance
total-quota=100
stale-nonce=600
no-multicast-peers

# Security
fingerprint
no-cli
