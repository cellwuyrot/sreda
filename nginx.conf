# ─────────────────────────────────────────────────────────────────────────────
# TrioZ / TZ.Connect — передний край.
#
# Файл включается на уровне `http{}` (рядом с `upstream`), поэтому зоны лимитов
# объявляются здесь же.
#
# ── Что здесь защищает и от чего ─────────────────────────────────────────────
#
# 1. Пустой server по умолчанию с `return 444` — запрос без нашего домена (прямой
#    заход по IP или скан) обрывается без ответа. Именно это мешает найти origin
#    по отпечатку сайта, когда домен уже спрятан за прокси.
# 2. Пределы частоты и числа соединений — чтобы «найти адрес» не означало
#    «положить сервис»: подбор пароля, поток загрузок и обычный флуд должны
#    стоить атакующему дороже, чем нам.
# 3. Ограничения размера тела и таймауты — против медленных запросов, которые
#    ничего не нарушают, а просто занимают соединения (slowloris).
#
# ── Чего здесь НЕТ намеренно ─────────────────────────────────────────────────
#
# • Предела ЧАСТОТЫ на `/api/socketio/`: там долгие соединения и всплески
#   переподключений после обрыва сети — такой предел рвал бы голосовые каналы
#   именно тогда, когда связь и без того плохая. Вместо него предел ЧИСЛА
#   соединений с адреса.
# • Запрета камеры и микрофона в `Permissions-Policy`: это голосовые каналы,
#   демонстрация экрана и видеозаметки. Политика разрешает их своему origin и
#   закрывает остальное.
#
# ЗАПОЛНИТЬ при переносе: `server_name`, диапазоны прокси в `set_real_ip_from`,
# сертификаты. Пока они не заданы, конфигурация работает, но защита от прямого
# захода по IP держится только на блоке-заглушке.
# ─────────────────────────────────────────────────────────────────────────────

upstream trioz_app {
    server app:3000;
    keepalive 32;
}

# Версия nginx в ответах не нужна никому, кроме того, кто подбирает уязвимости.
server_tokens off;

# ── Кто настоящий клиент ─────────────────────────────────────────────────────
# Когда впереди стоит прокси или анти-DDoS, `$remote_addr` — это ЕГО адрес, и все
# лимиты ниже считались бы на него одного: один шумный посетитель гасил бы всех.
# Раскомментировать и заполнить диапазонами своего прокси.
# set_real_ip_from 173.245.48.0/20;
# real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── Зоны лимитов ─────────────────────────────────────────────────────────────
# Ключ — адрес клиента. Значения с запасом под обычную работу: 20 запросов в
# секунду на страницы, 5 на API и по 1 на вход и загрузки, где каждая попытка
# стоит серверу дорого (проверка пароля считается медленно намеренно, письмо
# уходит в чужой сервис, файл занимает диск).
limit_req_zone $binary_remote_addr zone=tz_general:16m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tz_api:16m     rate=5r/s;
limit_req_zone $binary_remote_addr zone=tz_auth:8m     rate=1r/s;
limit_req_zone $binary_remote_addr zone=tz_upload:8m   rate=1r/s;
limit_conn_zone $binary_remote_addr zone=tz_conn:16m;

# Отказ по лимиту — 429, а не 503: клиент и человек должны различать «слишком
# часто» и «сервис лежит».
limit_req_status 429;
limit_conn_status 429;
# Превышения — обычное дело, а не авария: в журнал предупреждением.
limit_req_log_level warn;

# ── Запрос не к нашему домену ────────────────────────────────────────────────
# Прямой заход по IP, скан диапазона, чужой домен, направленный на наш адрес.
# 444 обрывает соединение молча: искать здесь нечего.
#
# ВАЖНО: блок работает только когда у рабочего блока ниже задан свой
# `server_name`. Пока там `_`, он принимает любой Host, и заглушка бесполезна.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment in production with SSL)
    # return 301 https://$host$request_uri;

    # FIX-UPLOAD: было 10M, а приложение принимает документы до 25 МБ
    # (api/files) — файлы крупнее 10 МБ nginx отбрасывал с 413 ещё до Next.js,
    # и в разделе «Документы» это выглядело как «ничего не сохраняется».
    # 30M — запас над лимитом приложения, чтобы отказ давало именно оно,
    # с понятным текстом ошибки.
    client_max_body_size 30M;

    # ── Против медленных запросов ────────────────────────────────────────────
    # Соединение, присылающее заголовки по байту в минуту, ничего не нарушает —
    # оно просто занимает место. Таймауты делают такую атаку бессмысленной.
    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     65s;
    reset_timedout_connection on;

    # Предел одновременных соединений с одного адреса. Щедрый: у страницы
    # мессенджера их законно несколько (сокет, вложения, загрузки), а у людей за
    # общим адресом — тем более.
    limit_conn tz_conn 64;

    # ── Заголовки безопасности ───────────────────────────────────────────────
    # `always` обязателен: без него заголовки не попадают в ответы с ошибкой.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Камера, микрофон и демонстрация экрана — это голосовые каналы и
    # видеозаметки: разрешаем своему origin, закрываем остальное.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(self), payment=(), usb=()" always;

    # Friendly "updating…" page served instead of a raw 502/503/504 while the
    # app container is briefly unavailable during a deploy. It auto-refreshes,
    # so browser clients recover on their own; the desktop shell sees the 502
    # status and shows its own splash + retry. Only wired into `location /`
    # (see proxy_intercept_errors there) so Socket.IO handshakes are untouched.
    error_page 502 503 504 /__maintenance.html;
    location = /__maintenance.html {
        root /etc/nginx/html;
        internal;
    }

    # WebSocket support for Socket.IO. NB: the transport path is `/api/socketio`
    # (packages/shared → SOCKET_PATH), not the socket.io default `/socket.io/`,
    # so this block must match the real path or the connection silently falls
    # through to `location /` with its shorter read timeout.
    # Предела ЧАСТОТЫ здесь нет намеренно (см. заголовок файла).
    location /api/socketio/ {
        limit_conn tz_conn 64;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Вход, регистрация, коды подтверждения ────────────────────────────────
    # Самое дорогое для сервера и самое привлекательное для перебора. Предел
    # частоты есть и в приложении, но пусть перебор упирается ещё до Node.
    location /api/auth/ {
        limit_req zone=tz_auth burst=10 nodelay;
        limit_conn tz_conn 16;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загрузка вложений: каждая занимает диск и процессор на проверку содержимого.
    location = /api/messages/upload {
        limit_req zone=tz_upload burst=20 nodelay;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Остальное API: щедрее входа, но не безгранично.
    location /api/ {
        limit_req zone=tz_api burst=40 nodelay;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FIX-SEC-UPLOADS: вложения переписки, документы и файлы задач отдаются
    # только вошедшему пользователю — проверку делает server.ts. Кэшировать
    # такой ответ на прокси нельзя: следующему запросу файл ушёл бы из кэша
    # уже без всякой проверки. Заголовок ставит само приложение (private),
    # здесь только выключаем кэш и не подменяем его своим.
    location ~ ^/uploads/(messages|voice|videos|documents|tasks|projects)/ {
        limit_req zone=tz_general burst=60 nodelay;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # Публичные загрузки: аватары, баннеры, иконки сообществ, значки. Они
    # открываются без входа по замыслу, поэтому кэш остаётся прежним.
    location /uploads/ {
        limit_req zone=tz_general burst=100 nodelay;
        proxy_pass http://trioz_app;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Self-hosted desktop installers — large, resumable downloads. Disable
    # buffering so bytes stream straight through and pass Range requests to the
    # app's custom static handler.
    # Предел ЧИСЛА соединений ниже: файл большой, и десяток параллельных докачек
    # с одного адреса — это уже не установка приложения.
    location /desktop/ {
        limit_conn tz_conn 8;
        proxy_pass http://trioz_app;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://trioz_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main app
    location / {
        limit_req zone=tz_general burst=40 nodelay;
        proxy_pass http://trioz_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Turn a bare "502 Bad Gateway" from a redeploying/booting app into the
        # branded, self-refreshing maintenance page defined above.
        proxy_intercept_errors on;
    }
}

