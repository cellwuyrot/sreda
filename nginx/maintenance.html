<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Auto-recover: reload every 3s so the page comes back on its own the
         moment the app container is healthy again. No user action needed. -->
    <meta http-equiv="refresh" content="3" />
    <title>TZ.Connect — обновление</title>
    <style>
      :root {
        --bg: #12121c;
        --accent: #00d4ff;
        --text: #e8eaf0;
        --muted: #4a5568;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.14) 0%, transparent 70%);
        filter: blur(20px);
      }
      .ring-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 26px;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--accent);
        border-right-color: var(--accent);
        animation: spin 1.2s linear infinite;
      }
      .ring-static {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      p {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        max-width: 340px;
        line-height: 1.5;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-static"></div>
    </div>
    <h1>Обновляемся…</h1>
    <p>Идёт обновление сервиса. Страница переподключится автоматически — ничего делать не нужно.</p>
  </body>
</html>
