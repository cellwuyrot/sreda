# Install ONLY after TLS certificate exists. Keep all existing TrioZ virtual hosts unchanged.
server {
 listen 80;
 server_name id.trioz.ru;
 location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://id.trioz.ru$request_uri; }
}
server {
 listen 443 ssl;
 server_name id.trioz.ru;
 ssl_certificate /etc/letsencrypt/live/id.trioz.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/id.trioz.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 16k;
 add_header Strict-Transport-Security "max-age=31536000" always;
 # Do not put authorization codes / tokens (query string) into access logs.
 access_log off;
 location / {
  proxy_pass http://127.0.0.1:3100;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection "";
 }
}
