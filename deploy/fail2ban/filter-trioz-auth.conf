# Фильтр: отказы приложения в журнале nginx.
#
# ВАЖНО про вход: NextAuth на неверный пароль отвечает НЕ 401, а 302 на
# страницу входа — то есть перебор пароля этим фильтром не ловится и НИКОГДА
# не ловился. Счёт попыток теперь ведёт само приложение (apps/web/src/lib/auth.ts:
# 20 попыток с адреса и 10 на учётную запись за 15 минут), а превышение лимита
# видно здесь как 429 — его этот фильтр и добирает баном на уровне брандмауэра.
#
# Ловим 401 (неверный пароль или код), 403 (запрещено) и 429 (упёрся в лимит).
# Успешные запросы и обычные 404 не считаем: по ним банить нельзя, иначе под бан
# попадёт любой, кто открыл старую ссылку.

[Definition]
failregex = ^<HOST> .* "(GET|POST) /api/(auth|push|vpn)[^"]*" (401|403|429) 
            ^<HOST> .* "POST /api/[^"]*" 429 
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S
