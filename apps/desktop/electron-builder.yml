appId: ru.trioz.connect.desktop
productName: TrioZ Connect
copyright: Copyright © TrioZ

directories:
  output: release
  buildResources: build

# Everything the packaged app needs at runtime. `static/` (the voice overlay and
# splash) and `resources/` (icons) are resolved relative to the app root, so
# they must be bundled alongside the compiled `dist/`.
#
# Иконки в build/ и resources/ не хранятся в git: их раскладывает
# scripts/prepare-icons.mjs из docs/logostol.png на шаге `npm run build`.
files:
  - dist/**/*
  - static/**/*
  - resources/**/*
  # WASAPI-SS: нативный аддон кладём рядом с dist/main/index.js
  - build/Release/wasapi_capture.node
  # VPN-EMBEDDED: бинарники клиента в asar НЕ нужны — они кладутся рядом с ним
  # через extraResources (см. ниже). Без этого исключения каждая сборка тащила
  # бы внутрь архива клиенты всех трёх платформ: лишние десятки мегабайт в
  # установщике, из которых на данной ОС не запускается ни один.
  - "!resources/wireguard/**"
  - package.json

# VPN-EMBEDDED: встроенный клиент туннеля.
#
# Кладём его через extraResources, а не через `files`, потому что `files`
# упаковывается в app.asar — а из архива нельзя ни запустить программу, ни
# выставить ей право на запуск. extraResources кладёт файлы в
# `process.resourcesPath/wireguard`, откуда их и берёт src/main/vpn.ts.
#
# Сами бинарники не лежат в git (это десятки мегабайт на три платформы, и
# навсегда): их раскладывает scripts/vendor-wireguard.mjs на шаге
# `npm run vendor:client` внутри `npm run build`. Если каталог платформы пуст,
# сборка соберётся, но туннель в ней честно скажет, что клиента нет.
#
# ВАЖНО: путь задаётся в каждой платформенной секции ЛИТЕРАЛЬНО и НЕ через
# макрос ${os}. Макрос раскрывается в `win`/`mac`/`linux`, а каталоги названы
# по `process.platform` (`win32`/`darwin`/`linux`) — так их ищет src/main/vpn.ts
# в режиме разработки, и так их раскладывает scripts/vendor-wireguard.mjs.
# Из-за этого рассогласования electron-builder копировал из несуществующей
# папки resources/wireguard/win, молча ничего не находил, и установщик
# собирался БЕЗ клиента — ровно то, на что жаловалось приложение.

extraMetadata:
  main: dist/main/index.js

# Registers the trioz:// deep-link scheme with the OS installer.
protocols:
  - name: TrioZ Connect
    schemes:
      - trioz

mac:
  category: public.app-category.social-networking
  icon: build/icon.png
  extraResources:
    - from: resources/wireguard/darwin
      to: wireguard
      filter:
        - "**/*"
  target:
    - dmg
    - zip

win:
  extraResources:
    - from: resources/wireguard/win32
      to: wireguard
      filter:
        - "**/*"
    # WASAPI-SS: нативный аддон. electron-builder копирует его
    # в resources/app/dist/main/ (рядом с index.js),
    # откуда wasapiCapture.ts и подгружает его через require().
    - from: build/Release/wasapi_capture.node
      to: app/dist/main/wasapi_capture.node
  # .ico отдельно не держим: electron-builder делает его из png сам, а лишняя
  # копия картинки в git означала бы старый логотип при следующей смене.
  icon: build/icon.ico
  # FIX-SEC: обновление ставится тихо и само (см. src/main/updater.ts), поэтому
  # подмена файла на раздающем сервере или перехват по пути — это выполнение
  # любого кода на машине пользователя. Единственная защита — подпись: без
  # неё latest.yml проверяет только хеш, а хеш подменяется вместе с файлом.
  # Сертификат передаётся сборке переменными CSC_LINK и CSC_KEY_PASSWORD
  # (в файл их класть нельзя). До покупки сертификата проверку НЕ снимать,
  # а выкладывать обновления только по HTTPS и с закрытой выгрузкой на сервер.
  verifyUpdateCodeSignature: true
  target:
    # nsis-web  → маленький онлайн-установщик (стаб), скачивает приложение с
    #             вашего сервера во время установки (модель, как у Discord).
    # nsis      → обычный автономный установщик (один самодостаточный .exe).
    - nsis-web
    - nsis

# Общие настройки установщика (применяются к обоим NSIS-таргетам).
nsis:
  oneClick: false                       # мастер установки, а не «тихая» установка
  perMachine: true                      # SERVICE-TUNNEL: установщик один раз просит права
                                        # администратора и регистрирует служебный
                                        # компонент туннеля. Это единственное окно UAC
                                        # за всё время: включение VPN потом идёт без него.
  allowToChangeInstallationDirectory: true  # даёт выбрать папку/диск
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Онлайн-установщик берёт пакет приложения (.7z) с этого адреса. Должен
# совпадать с `publish.url` ниже — туда вы загружаете собранные файлы.
nsisWeb:
  appPackageUrl: https://trioz.ru/desktop/

linux:
  icon: build/icon.png
  category: Network
  extraResources:
    - from: resources/wireguard/linux
      to: wireguard
      filter:
        - "**/*"
  target:
    - AppImage
    - deb

# Фид, откуда клиент качает пакет приложения и обновления (electron-updater
# читает отсюда latest.yml). Замените URL на адрес, куда будете заливать файлы
# из папки release/.  Для приватного репозитория можно вместо generic
# использовать provider: github.
publish:
  - provider: generic
    url: https://trioz.ru/desktop/
