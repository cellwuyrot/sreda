<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline';" />
    <title>TZ.Connect</title>
    <style>
      :root {
        --bg: #12121c;
        --accent: #00d4ff;
        --text: #e8eaf0;
        --muted: #4a5568;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        overflow: hidden;
      }
      /* Ambient glow behind the mark */
      .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 255, 0.14) 0%, transparent 70%);
        filter: blur(20px);
      }
      .ring-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 28px;
      }
      .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--accent);
        border-right-color: var(--accent);
        animation: spin 1.2s linear infinite;
      }
      .ring-static {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        object-fit: cover;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      p {
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .dots {
        display: flex;
        gap: 6px;
        margin-top: 30px;
      }
      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.2;
        animation: pulse 1s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="ring-wrap">
      <div class="ring"></div>
      <div class="ring-static"></div>
      <img class="logo" src="../../resources/icon.png" alt="TZ.Connect" />
    </div>
    <h1>TZ.Connect</h1>
    <p>Экосистема TrioZ</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </body>
</html>
