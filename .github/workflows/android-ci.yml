name: Android checks
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'docs/logostol.png', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['apps/android/**', 'docs/logostol.png', '.github/workflows/android-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 apps/android/tools/vpn-policy.py validate
      - run: python3 -m unittest discover -s apps/android/tools -p 'test_*.py'
      - run: bash apps/android/gradlew -p apps/android --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-test-only
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
