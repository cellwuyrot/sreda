name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'docs/logostol.png'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'docs/logostol.png'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Validate VPN admission policy
        run: python3 apps/android/tools/vpn-policy.py validate

      - name: Test VPN policy tool
        run: python3 -m unittest discover -s apps/android/tools -p 'test_*.py'

      - name: Test, lint and build Android
        run: bash apps/android/gradlew -p apps/android --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-test-only
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7